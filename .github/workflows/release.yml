name: Calendly Bookings Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to prepare on main
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      prerelease:
        description: Optional prerelease identifier (for example beta.1)
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

concurrency:
  group: calendly-bookings-release
  cancel-in-progress: false

env:
  PLUGIN_SLUG: calendly-bookings
  PLUGIN_MAIN_FILE: calendly-bookings.php
  CONSTANTS_FILE: includes/constants.php
  VERSION_FILE: version.txt

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '\r\n ' < "$VERSION_FILE")"
          base="${current%%-*}"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid current version: $current" >&2; exit 1; }
          IFS='.' read -r major minor patch <<< "$base"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          [[ -z "$PRERELEASE" ]] || version="$version-$PRERELEASE"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Update plugin version metadata
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          v=os.environ['NEW_VERSION']
          p=Path(os.environ['PLUGIN_MAIN_FILE']); s=p.read_text(); s=re.sub(r'(\*\s*Version:\s*)[^\r\n]+', r'\g<1>'+v, s, count=1); p.write_text(s)
          p=Path(os.environ['CONSTANTS_FILE']); s=p.read_text(); s=re.sub(r"(public\s+const\s+VERSION\s*=\s*')[^']+(';)", r'\g<1>'+v+r'\2', s, count=1); p.write_text(s)
          p=Path('readme.txt'); s=p.read_text(); s=re.sub(r'^Stable tag:.*$', 'Stable tag: '+v, s, count=1, flags=re.M); p.write_text(s)
          Path(os.environ['VERSION_FILE']).write_text(v+'\n')
          PY
      - name: Validate source versions
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Version: $NEW_VERSION" "$PLUGIN_MAIN_FILE"
          grep -Fq "VERSION = '$NEW_VERSION'" "$CONSTANTS_FILE"
          grep -Fq "Stable tag: $NEW_VERSION" readme.txt
          grep -Fxq "$NEW_VERSION" "$VERSION_FILE"
      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLUGIN_MAIN_FILE" "$CONSTANTS_FILE" readme.txt "$VERSION_FILE"
          git commit -m "chore(release): v$NEW_VERSION"
          git push origin HEAD:main
      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '\r\n ' < "$VERSION_FILE")"
          [[ "$tag" == "$source_version" ]] || { echo "Tag $tag does not match version.txt $source_version"; exit 1; }
          grep -Fq "Version: $source_version" "$PLUGIN_MAIN_FILE"
          grep -Fq "VERSION = '$source_version'" "$CONSTANTS_FILE"
          grep -Fq "Stable tag: $source_version" readme.txt
      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p "build/$PLUGIN_SLUG"
          rsync -a ./ "build/$PLUGIN_SLUG/" --exclude='.git' --exclude='.github' --exclude='build' --exclude='.gitignore' --exclude='tests' --exclude='audit' --exclude='.env*' --exclude='debug-token.php' --exclude='phpunit.xml*'
          (cd build && zip -qr "$PLUGIN_SLUG.zip" "$PLUGIN_SLUG")
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "build/$PLUGIN_SLUG.zip"
          version="$(tr -d '\r\n ' < "$VERSION_FILE")"
          # WordPress updates plugins by plugin basename. The installable archive MUST
          # contain the existing plugin directory and main file at the archive root.
          unzip -l "build/$PLUGIN_SLUG.zip" | grep -Fq " $PLUGIN_SLUG/$PLUGIN_MAIN_FILE"
          unzip -l "build/$PLUGIN_SLUG.zip" | grep -Eq "^[[:space:]]*[0-9]+[[:space:]]+[0-9-]+[[:space:]]+[0-9:]+[[:space:]]+$PLUGIN_SLUG/$PLUGIN_MAIN_FILE$"
          ! unzip -l "build/$PLUGIN_SLUG.zip" | grep -Eq "^[[:space:]]*[0-9]+[[:space:]]+[0-9-]+[[:space:]]+[0-9:]+[[:space:]]+$PLUGIN_MAIN_FILE$"
          unzip -p "build/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG/$PLUGIN_MAIN_FILE" | grep -Fq "Version: $version"
          unzip -p "build/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG/$VERSION_FILE" | grep -Fxq "$version"
          ! unzip -l "build/$PLUGIN_SLUG.zip" | grep -q 'debug-token.php'
      - name: Generate checksums
        shell: bash
        run: |
          cd build
          sha256sum "$PLUGIN_SLUG.zip" > "$PLUGIN_SLUG.zip.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Calendly Bookings ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/${{ env.PLUGIN_SLUG }}.zip
            build/${{ env.PLUGIN_SLUG }}.zip.sha256
